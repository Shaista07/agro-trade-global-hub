name: Daily mandi price update

# Runs every day at 01:30 UTC = 7:00 AM IST, after APMC Azadpur publishes
# the day's P.T.R. Can also be run manually: Actions tab → "Daily mandi price
# update" → Run workflow.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pdfplumber

      - name: Fetch APMC rates and build prices.json
        run: python scripts/update_prices.py

      - name: Commit updated price files
        run: |
          git config user.name "GTW Price Bot"
          git config user.email "bot@globaltradewave.com"
          git add prices.json history.json
          if git diff --cached --quiet; then
            echo "Prices unchanged — nothing to commit."
          else
            git commit -m "chore: daily mandi prices ($(date +%Y-%m-%d))"
            git push
          fi
